name: dbt CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbt-build-test:
    name: dbt build & test (DuckDB)
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}
      DBT_TARGET: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-duckdb duckdb pandas requests pyyaml pytest

      - name: Verify dbt installation
        run: dbt --version

      - name: Run raw ingestion loader
        run: python ingestion/load_raw.py

      - name: dbt deps
        run: dbt deps

      - name: dbt seed
        run: dbt seed --full-refresh

      - name: dbt run
        run: dbt run

      - name: dbt test
        run: dbt test

      - name: Run pipeline QA suite
        run: python test_pipeline.py

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            target/manifest.json
            target/run_results.json
            target/catalog.json
            logs/dbt.log
          if-no-files-found: ignore
          retention-days: 7
